# Metadata columns added to every bronze row (see docs/DATA_MODELING.md).
# Source columns are not listed: bronze keeps them all as strings.
columns:
  - name: _file_name
    type: string
    description: Source file name (not full path)
  - name: _ingested_at
    type: timestamp_utc
    description: When this load wrote the row; identical for every row in one load
  - name: _file_hash
    type: string
    description: SHA-256 hex of the source file bytes
  - name: _row_number
    type: int
    description: >-
      Delimited files: 1-based position among data rows (the header is not counted).
      Workbooks: the row number as shown in the sheet (first data row is header_row + 1,
      so 2 with header_row 1), counted per sheet, empty rows inside the data keep their numbers.
  - name: _sheet_name
    type: string
    description: Sheet a row came from; null for files that are not workbooks (and in older bronze files)
