name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # An explicit bash adds -eo pipefail, so a failure inside a pipe is not hidden.
    shell: bash

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

  sqlfluff:
    name: sqlfluff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Lint tracked SQL files
        run: |
          # The assignment fails the step if git fails; only a truly empty list skips.
          files="$(git ls-files -- '*.sql')"
          if [[ -z "$files" ]]; then
            echo "result=skipped reason=no_sql_files"
            exit 0
          fi
          git ls-files -z -- '*.sql' | xargs -0 uv run --no-sync sqlfluff lint

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download, verify and run actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # linux_amd64 line of the release's checksums file.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$archive" "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          python-version: "3.12"

      # The version is pinned in pyproject.toml and its hashes are checked from uv.lock.
      - name: Audit workflows and Dependabot config
        env:
          # Read-only workflow token; enables the audits that query GitHub.
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --only-group ci zizmor .github

  ci-green:
    name: CI green
    needs: [ruff, sqlfluff, pytest, actionlint, zizmor]
    # Without always(), a failed dependency would skip this job, and a skipped
    # required check counts as passing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "job=\(.key) result=\(.value.result)"' <<<"$NEEDS"
          jq -e 'length > 0 and all(.[]; .result == "success")' <<<"$NEEDS"
