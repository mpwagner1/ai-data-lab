# Risk register: every suppressed finding or ignored advisory, with why, who and until when.
# Checked by tests/test_risk_register.py. One entry per file + kind + rule.
#
#   count      exact number of occurrences; adding or removing one fails the test
#   max_count  allows 0 up to this number; only for a suppression that is still in an open PR
#   expires    unquoted YYYY-MM-DD; the test fails from the day after
#
# When an entry expires, remove the suppression or review the reason and set a new date.

[[entry]]
file = ".sqlfluff"
kind = "sqlfluff-exclude-rules"
rule = "LT05"
count = 1
reason = "Line-length rule switched off in the initial scaffold (1f27bcd); no reason was recorded. No .sql files are tracked yet, so it hides nothing today. Review when the first SQL model lands."
owner = "mpwagner1"
expires = 2027-05-27

[[entry]]
file = ".github/workflows/claude.yml"
kind = "zizmor-ignore"
rule = "dangerous-triggers"
count = 1
reason = "Added by PR #149 on the issue_comment trigger. There the job `if` requires an OWNER, MEMBER or COLLABORATOR author, and the workflow comment states the action refuses actors without write access."
owner = "mpwagner1"
expires = 2027-05-27

