[project]
name = "ai-data-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.1",
    "dagster>=1.13.31",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "fastexcel>=0.21.0",
    "polars>=2.1.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

# Build dependencies are not locked by uv, so pin the ones hatchling pulls in.
[tool.uv]
build-constraint-dependencies = [
    "editables==0.6",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[dependency-groups]
ci = [
    "zizmor==1.32.0",
]
dev = [
    "openpyxl>=3.1.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "sqlfluff>=4.5.0",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
